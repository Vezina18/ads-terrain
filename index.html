<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADS Terrain</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#349650">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Terrain">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>

/* Layout: app mobile plein écran. En-tête fixe, zone défilante, barre d'onglets en bas.
   Palette: vert forêt ADS sur neutre vert-gris; rouge/vert réservés aux états punch. */
:root{
  --bg:#f0f3ea; --surface:#ffffff; --surface-2:#e6ece0; --ink:#16231a; --muted:#56655a; --line:#d6ddcc;
  --accent:#1f6b3a; --accent-ink:#ffffff; --tint:#dcebd9;
  --go:#1f8a4c; --stop:#c0392b; --warn:#a4670b; --warn-tint:#f5e8cf;
  --shadow:0 1px 2px rgba(22,35,26,.08),0 6px 18px rgba(22,35,26,.06);
  --font-d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1710; --surface:#17241a; --surface-2:#1f3023; --ink:#e7efe4; --muted:#94a898; --line:#28392c;
    --accent:#78d688; --accent-ink:#0d2314; --tint:#1d3a25;
    --go:#4cc279; --stop:#f0705e; --warn:#e3a94a; --warn-tint:#3a2e14;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1710; --surface:#17241a; --surface-2:#1f3023; --ink:#e7efe4; --muted:#94a898; --line:#28392c;
  --accent:#78d688; --accent-ink:#0d2314; --tint:#1d3a25;
  --go:#4cc279; --stop:#f0705e; --warn:#e3a94a; --warn-tint:#3a2e14;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.35;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}
.screen{height:100%;display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}

/* Connexion */
#login{justify-content:center;gap:22px;padding-block:24px}
.mark{width:68px;height:68px;border-radius:18px;background:#1a2e1d;color:#78d688;display:grid;place-items:center;font:700 26px/1 var(--font-d);letter-spacing:0}
#login h1{font:700 40px/1 var(--font-d);margin:0;letter-spacing:.01em;text-transform:uppercase}
#login p{margin:6px 0 0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input{height:54px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:18px}
.btn{height:56px;border:none;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:0 18px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.err{color:var(--stop);font-size:14px;min-height:20px;margin:0}
.demo-hint{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 16px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .mark{width:40px;height:40px;border-radius:10px;font-size:14px;flex:none}
.who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px;flex:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--go)}
.sync.off i{background:var(--warn)}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.tab{border:none;background:none;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{background:var(--tint);color:var(--accent)}

/* Punch */
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
h1.big{font:700 38px/1.05 var(--font-d);margin:4px 0 0;text-transform:uppercase}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.plist{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;min-height:64px}
.pick .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.pick.on{border-color:var(--accent);background:var(--tint)}
.pick.on .dot{border-color:var(--accent)}
.pick.on .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.pick b{display:block;font-size:17px}
.pick small{color:var(--muted);font-size:13px}
.dock{position:sticky;bottom:0;padding-top:14px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.punch{width:100%;height:84px;border:none;border-radius:20px;font:700 34px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;color:#fff;box-shadow:var(--shadow)}
.punch.go{background:var(--go)}
.punch.stop{background:var(--stop)}
.live{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 18px;text-align:center;box-shadow:var(--shadow)}
.live .pulse{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--go)}
.live .pulse::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--go);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .pulse::before{animation:none}}
.clock{font:700 clamp(40px,15vw,76px)/1 var(--font-d);letter-spacing:0;white-space:nowrap;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.live .proj{font-size:18px;font-weight:600}
.live .since{color:var(--muted);font-size:14px;margin-top:2px}
.linkbtn{margin-top:14px;border:1.5px solid var(--line);background:none;border-radius:12px;height:46px;padding:0 16px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .l{min-width:0}
.row .l b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l small{color:var(--muted)}
.row .r{font-weight:700;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.empty{color:var(--muted);padding:14px 0;font-size:14px}

/* Projets */
.pcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.pcard h3{margin:0 0 2px;font-size:18px}
.pcard .addr{color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--tint);color:var(--accent)}
.chip.warn{background:var(--warn-tint);color:var(--warn)}
.back{border:none;background:none;font-weight:600;color:var(--accent);padding:10px 0;font-size:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin:12px 0}
.seg button{border:none;background:none;border-radius:9px;height:42px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ck{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:none}
.ck input{width:26px;height:26px;flex:none;accent-color:var(--accent);margin:0}
.ck b{font-weight:500}
.ck.done b{text-decoration:line-through;color:var(--muted)}
.ck small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
.addrow .btn{height:48px;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.grid button{aspect-ratio:1;border:none;padding:0;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.cam{width:100%;height:60px;border:2px dashed var(--accent);background:var(--tint);color:var(--accent);border-radius:14px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.cam svg{width:24px;height:24px}
.j{padding:12px 0;border-bottom:1px solid var(--line)}
.j small{color:var(--muted);font-size:12px}
.j p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.j img{max-width:100%;width:220px;border-radius:10px;margin-top:8px;display:block}
textarea{width:100%;min-height:76px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;resize:vertical}
.jtools{display:flex;gap:8px;margin-top:8px}
.jtools .btn{flex:1;height:48px}
.jtools .btn.ghost{flex:none;width:56px;display:grid;place-items:center}
.jtools svg{width:22px;height:22px}
.pending-img{margin-top:8px;position:relative;width:96px}
.pending-img img{width:96px;height:96px;object-fit:cover;border-radius:10px;display:block}

/* Moi */
.total{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px}
.total b{font:700 52px/1 var(--font-d)}
.dayh{display:flex;justify-content:space-between;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}

/* Feuille punch out + visionneuse */
.veil{position:fixed;inset:0;background:rgba(10,16,12,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font:700 30px/1 var(--font-d);text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{flex:1;min-width:56px;height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sum{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;font-weight:600}
.lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.banner{font-size:12px;color:var(--warn);background:var(--warn-tint);border-radius:8px;padding:6px 10px;margin-bottom:6px;text-align:center}

#app{padding-top:env(safe-area-inset-top,0px)}
.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:600;text-align:center;box-shadow:var(--shadow)}
.btn[disabled]{opacity:.6}
.remember{display:flex;align-items:center;gap:12px;min-height:44px;font-weight:600;cursor:pointer}
.remember input{width:24px;height:24px;accent-color:var(--accent);margin:0;flex:none}

.alert{margin-top:12px;background:var(--warn-tint);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.35}
.alert b{display:block;font-size:16px;margin-bottom:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:4px;background:var(--tint);color:var(--accent);vertical-align:1px}
.tag.wait{background:var(--warn-tint);color:var(--warn)}
.grid button{position:relative}
.tag.pin{position:absolute;left:4px;bottom:4px;margin:0}
.ctl{height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;width:100%;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 8px}
.note{color:var(--muted);font-size:13px;margin:16px 0 0}
.addr-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:36px}
.addr-link svg{width:18px;height:18px;flex:none}
.lbtools{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.lbtools .btn{flex:1;height:48px}
.btn.danger{background:var(--stop);color:#fff}
button.row{width:100%;background:none;border:none;border-bottom:1px solid var(--line);text-align:left;padding:12px 0}
button.row:last-child{border-bottom:none}
.sheet{max-height:92vh;overflow-y:auto}
.wknav{display:flex;align-items:center;justify-content:space-between}
.wknav button{width:44px;height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-size:22px;font-weight:700}
.wknav button[disabled]{opacity:.35}
.upd{position:fixed;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:50;max-width:536px;margin:0 auto;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;box-shadow:var(--shadow)}
.upd button{border:none;border-radius:9px;height:36px;padding:0 12px;font-weight:700;background:var(--accent-ink);color:var(--accent)}
.lb{position:fixed}
.live.paused{border-color:var(--warn)}
.live.paused .pulse{color:var(--warn)}
.live.paused .pulse::before{background:var(--warn)}
.live.paused .clock{color:var(--warn)}
.punch.pause{background:var(--warn);font-size:28px;height:72px}
.dock{display:flex;flex-direction:column;gap:10px}
.dock .two{gap:10px}
.btn.big2{height:60px;font-size:18px}
.btn.wide{width:100%}
.pick{width:100%}
.eqdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.eqdot.eq1{background:#3b82f6}.eqdot.eq2{background:#f97316}
.evc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:64px}
.evc .evt{flex:1;min-width:0}.evc .evt b{display:block;font-size:17px}.evc small{color:var(--muted);font-size:13px}
.evc .go{font-size:24px;color:var(--muted)}.evc .now{font-style:normal;font-weight:700;color:var(--go)}
.tab{font-size:11px}
.agh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.navb{width:44px;height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-size:22px;font-weight:700;flex:none}
.aglg{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);margin:8px 0 10px}
.aglg span{display:inline-flex;align-items:center;gap:6px}.aglg button{margin-left:auto!important}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal.head{margin-bottom:3px}.cal.head span{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.dc{min-height:72px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 0 3px;display:flex;flex-direction:column;gap:2px;text-align:left;overflow:hidden}
.dc.out{opacity:.45}
.dc.sel{border:2px solid var(--accent)}
.dc .dn{font-size:12px;font-weight:700;padding:0 4px}
.dc.today .dn{display:inline-grid;place-items:center;width:20px;height:20px;margin:0 0 0 2px;padding:0;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.bar{display:block;font-style:normal;font-size:9px;line-height:13px;height:13px;color:#fff;font-weight:700;padding:0 3px;overflow:hidden;white-space:nowrap;border-radius:3px;margin:0 1px}
.bar.eq1{background:#3b82f6}.bar.eq2{background:#d9560a}
.more{font-style:normal;font-size:10px;color:var(--muted);padding:0 4px}
.eqdot.eq2{background:#f97316}
</style>
</head>
<body>
<div id="app">
  <section id="loading" class="screen center"><div class="spin" aria-hidden="true"></div><div class="lbl">Chargement</div></section>

  <section id="bootErr" class="screen center" hidden>
    <div class="mark">ADS</div>
    <p id="bootMsg" style="margin:0;max-width:320px"></p>
    <button class="btn" data-act="retry" style="width:100%;max-width:320px">Réessayer</button>
  </section>

  <section id="login" class="screen" hidden>
    <div><div class="mark">ADS</div></div>
    <div>
      <h1>ADS Terrain</h1>
      <p>Punch et suivi de chantier.</p>
    </div>
    <form id="loginForm" class="field" style="gap:14px" autocomplete="off">
      <div class="field"><label for="lid">Identifiant</label><input id="lid" autocapitalize="none" autocorrect="off" autocomplete="username"></div>
      <div class="field"><label for="lpin">NIP</label><input id="lpin" type="password" inputmode="numeric" autocomplete="current-password"></div>
      <label class="remember"><input type="checkbox" id="lremember" checked><span>Se souvenir de moi</span></label>
      <p class="err" id="lerr" role="alert"></p>
      <button class="btn" id="lbtn" type="submit">Entrer</button>
    </form>
  </section>

  <section id="main" class="screen" hidden>
    <header class="top">
      <div class="who"><div class="mark">ADS</div><div style="min-width:0"><b id="hello"></b><span id="roleLbl">Employé</span></div></div>
      <div class="sync" id="sync"><i></i><span>En ligne</span></div>
    </header>
    <main id="view"></main>
    <nav class="tabs" aria-label="Navigation">
      <button class="tab" data-act="tab" data-tab="punch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Punch</button>
      <button class="tab" data-act="tab" data-tab="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h3"/></svg>Agenda</button>
      <button class="tab" data-act="tab" data-tab="projets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projets</button>
      <button class="tab" data-act="tab" data-tab="moi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Heures</button>
    </nav>
